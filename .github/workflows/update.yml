name: Update paper data

on:
  schedule:
    # 매일 UTC 20:00 (한국시간 새벽 5시)에 실행
    - cron: '0 20 * * *'
  workflow_dispatch: {}   # 수동 실행 버튼도 사용 가능

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run collector
        run: python collect.py

      - name: Commit updated data
        run: |
          git config user.name "paper-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/papers.json
          git diff --quiet --cached || git commit -m "chore: update paper data"
          git push
